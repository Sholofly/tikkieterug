services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8014:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - app-data:/app/data
      - ./config.json:/app/wwwroot/config.json:ro
    restart: unless-stopped
    # Healthy when both calls return 200: "/" (the frontend, static index.html) and
    # "/health" (the API, checks the database). Neither calls the upstream.
    # curl is installed in the Dockerfile; --fail-early stops at the first failing URL.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--fail-early", "--max-time", "2", "-o", "/dev/null", "http://127.0.0.1:8080/", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  app-data:
